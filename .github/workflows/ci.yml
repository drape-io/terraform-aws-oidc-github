name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive

  validate:
    name: Terraform Validate
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - name: Validate provider module
        run: cd modules/provider && terraform init -backend=false && terraform validate
      - name: Validate role module
        run: cd modules/role && terraform init -backend=false && terraform validate

  test:
    name: Terraform Test (${{ matrix.terraform }})
    needs: [validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported release and the newest.
        terraform: ["1.6.6", "latest"]
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
      - run: terraform init
      - run: terraform test
